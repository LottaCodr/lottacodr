<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lotanna Chuka — Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.45" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#0B0813"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#A855F7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="heroVillain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.38" stop-color="#60A5FA"/>
      <stop offset="0.66" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.85"/>
      <stop offset="0.86" stop-color="#F472B6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <radialGradient id="gridFade" cx="0.5" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <mask id="gridMask">
      <rect width="1200" height="340" fill="url(#gridFade)"/>
    </mask>

    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1, end) infinite; }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <g mask="url(#gridMask)"><rect width="1200" height="340" fill="url(#grid)"/></g>

  <!-- atmosphere -->
  <ellipse cx="170" cy="40" rx="420" ry="300" fill="url(#glowCyan)"/>
  <ellipse cx="1080" cy="320" rx="440" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="640" cy="360" rx="380" ry="200" fill="url(#glowPink)"/>

  <!-- sparse stars -->
  <g fill="#E2E8F0">
    <circle cx="520" cy="58" r="1.4" opacity="0.5"/>
    <circle cx="612" cy="112" r="1" opacity="0.35"/>
    <circle cx="452" cy="300" r="1.2" opacity="0.3"/>
    <circle cx="676" cy="252" r="1" opacity="0.28"/>
    <circle cx="300" cy="46" r="1" opacity="0.3"/>
    <circle cx="1168" cy="66" r="1.3" opacity="0.35"/>
    <circle cx="34" cy="228" r="1.2" opacity="0.28"/>
  </g>

  <!-- status pill -->
  <g>
    <rect x="64" y="56" width="232" height="32" rx="16" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.32"/>
    <circle cx="88" cy="72" r="4.5" fill="#22D3EE"/>
    <circle cx="88" cy="72" r="8" fill="#22D3EE" fill-opacity="0.18"/>
    <text class="mono" x="103" y="76.5" font-size="11.5" font-weight="600" letter-spacing="1.9" fill="#67E8F9">OPEN TO COLLABORATE</text>
  </g>

  <!-- location pill -->
  <g>
    <rect x="312" y="56" width="122" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <g transform="translate(330,61) scale(0.9)" fill="#F472B6">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
    </g>
    <text class="mono" x="358" y="76.5" font-size="12" letter-spacing="0.6" fill="#94A3B8">Nigeria</text>
  </g>

  <!-- identity -->
  <text class="sans" x="61" y="158" font-size="63" font-weight="800" letter-spacing="-1.4" fill="url(#nameShade)">LOTANNA CHUKA</text>
  <text class="sans" x="63" y="198" font-size="21" font-weight="700" letter-spacing="4.4" fill="url(#heroVillain)">FULL-STACK ENGINEER</text>
  <text class="sans" x="64" y="229" font-size="16.5" font-weight="500" letter-spacing="0.4" fill="#94A3B8">Web Applications &#183; Mobile &#183; AI Systems</text>

  <rect x="64" y="251" width="52" height="2.5" rx="1.25" fill="url(#heroVillain)"/>
  <text class="sans" x="64" y="288" font-size="16" font-style="italic" fill="#7C8698">&#8220;A superhero by birth, a supervillain by backstory.&#8221;</text>

  <!-- terminal card -->
  <g>
    <rect x="700" y="62" width="436" height="222" rx="14" fill="#0D1220" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <path d="M700 76a14 14 0 0 1 14-14h408a14 14 0 0 1 14 14v22H700z" fill="#FFFFFF" fill-opacity="0.035"/>
    <line x1="700" y1="98" x2="1136" y2="98" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <circle cx="724" cy="80" r="5.5" fill="#FF5F57"/>
    <circle cx="744" cy="80" r="5.5" fill="#FEBC2E"/>
    <circle cx="764" cy="80" r="5.5" fill="#28C840"/>
    <text class="mono" x="918" y="84" font-size="11.5" letter-spacing="0.7" fill="#475569" text-anchor="middle">lottacodr &#8212; zsh</text>

    <g class="mono" font-size="13">
      <text x="724" y="128"><tspan fill="#22D3EE">$ </tspan><tspan fill="#E2E8F0">whoami</tspan></text>
      <text x="724" y="153"><tspan fill="#475569">&#8250; </tspan><tspan fill="#94A3B8">engineer &#183; product-minded &#183; nigeria</tspan></text>

      <text x="724" y="180"><tspan fill="#22D3EE">$ </tspan><tspan fill="#E2E8F0">stack --current</tspan></text>
      <text x="724" y="205"><tspan fill="#475569">&#8250; </tspan><tspan fill="#A5B4FC">next.js &#183; typescript &#183; express &#183; fastapi &#183; expo</tspan></text>

      <text x="724" y="232"><tspan fill="#22D3EE">$ </tspan><tspan fill="#E2E8F0">status</tspan></text>
      <text x="724" y="257"><tspan fill="#475569">&#8250; </tspan><tspan fill="#4ADE80">shipping</tspan><tspan fill="#94A3B8"> &#8212; 100+ repos and counting</tspan></text>
    </g>
    <rect class="cursor" x="1012" y="246" width="8" height="14" rx="1" fill="#22D3EE" fill-opacity="0.85"/>
  </g>

  <!-- bottom accent -->
  <rect x="0" y="336" width="1200" height="4" fill="url(#accentLine)"/>
</svg>
