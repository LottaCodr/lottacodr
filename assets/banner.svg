<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lotanna Chuka — Product Engineer">
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0B0C0E"/>

  <!-- quiet monogram -->
  <text class="sans" x="1112" y="232" font-size="200" font-weight="700" letter-spacing="-6" fill="#FFFFFF" fill-opacity="0.035" text-anchor="end">LC</text>

  <!-- status -->
  <circle cx="91" cy="76" r="3.5" fill="#5EEAD4"/>
  <text class="mono" x="106" y="80" font-size="11" font-weight="500" letter-spacing="2.6" fill="#8A8F98">OPEN TO COLLABORATE</text>

  <!-- identity -->
  <text class="sans" x="86" y="158" font-size="54" font-weight="600" letter-spacing="-1.1" fill="#F4F4F5">Lotanna Chuka</text>
  <text class="sans" x="88" y="198" font-size="14.5" font-weight="600" letter-spacing="6.5" fill="#5EEAD4">PRODUCT ENGINEER</text>
  <text class="sans" x="88" y="228" font-size="15" font-weight="400" letter-spacing="0.2" fill="#8A8F98">Web &#183; Mobile &#183; AI Systems</text>

  <rect x="88" y="248" width="48" height="1" fill="#26282E"/>

  <text class="sans" x="88" y="276" font-size="14.5" font-style="italic" fill="#6B7078">A superhero by birth, a supervillain by backstory.</text>
</svg>
